name: main

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bunx checks-release-tag
